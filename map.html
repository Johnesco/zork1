<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map — Zork I - The Great Underground Empire</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #d4c5a9;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

/* --- Layout --- */
.container {
  display: flex;
  height: 100%;
}

/* --- Sidebar --- */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: #0e0e0c;
  border-right: 1px solid #1e1a14;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid #1e1a14;
}

.sidebar-header h1 {
  font-size: 0.95em;
  color: #c4b48a;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.sidebar-header a {
  font-size: 0.8em;
  color: #887755;
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.sidebar-header a:hover {
  color: #aa9966;
  border-bottom-color: #aa9966;
}

.stats {
  padding: 10px 16px;
  border-bottom: 1px solid #1e1a14;
  font-size: 0.8em;
  color: #776655;
  line-height: 1.6;
}

.stats strong {
  color: #aa9966;
}

.room-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.room-list::-webkit-scrollbar { width: 6px; }
.room-list::-webkit-scrollbar-track { background: #0e0e0c; }
.room-list::-webkit-scrollbar-thumb { background: #2a2418; border-radius: 3px; }

.room-item {
  display: block;
  padding: 6px 16px;
  font-size: 0.85em;
  color: #998866;
  text-decoration: none;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s, color 0.1s;
}

.room-item:hover {
  background: #151510;
  color: #c4b48a;
}

.room-item.active {
  background: #18160f;
  color: #e8d090;
  border-left-color: #e8d090;
}

.room-item .visit-count {
  font-size: 0.8em;
  color: #554433;
  margin-left: 4px;
}

.room-item.start-room::before {
  content: "\25B6 ";
  font-size: 0.7em;
  color: #8bab6e;
}

/* --- Map area --- */
.map-area {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0a0a0a;
}

.map-toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 6px;
  z-index: 10;
}

.map-toolbar button {
  background: #1a1810;
  border: 1px solid #2a2418;
  border-radius: 4px;
  color: #887755;
  font-family: "SF Mono", "Fira Code", Consolas, "Courier New", monospace;
  font-size: 0.85em;
  padding: 4px 10px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.map-toolbar button:hover {
  background: #2a2010;
  color: #c4b48a;
  border-color: #4a3a20;
}

.map-svg {
  width: 100%;
  height: 100%;
  cursor: grab;
}

.map-svg:active {
  cursor: grabbing;
}

/* SVG room styling */
.map-svg .room-box {
  cursor: pointer;
}

.map-svg .room-box rect {
  transition: stroke 0.15s, fill 0.15s;
}

.map-svg .room-box:hover rect {
  stroke: #aa9966;
  fill: #2a2418;
}

.map-svg .room-box.highlighted rect {
  stroke: #e8d090;
  fill: #2a2418;
  stroke-width: 2;
}

.map-svg .room-box.start rect {
  stroke: #8bab6e;
}

.map-svg .edge-line {
  transition: stroke 0.15s;
}

.map-svg .edge-line.highlighted {
  stroke: #e8d090 !important;
  stroke-width: 2;
}

/* --- Floor labels --- */
.floor-label {
  font-family: Georgia, serif;
  font-size: 12px;
  fill: #554433;
  font-style: italic;
}

/* --- Tooltip --- */
.tooltip {
  position: absolute;
  background: #1a1810;
  border: 1px solid #3a3020;
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 0.8em;
  color: #d4c5a9;
  pointer-events: none;
  z-index: 20;
  max-width: 300px;
  display: none;
}

.tooltip .tt-name {
  color: #e8d8b0;
  font-weight: bold;
  margin-bottom: 2px;
}

.tooltip .tt-desc {
  color: #998866;
  font-size: 0.9em;
  line-height: 1.3;
}

/* --- Responsive --- */
@media (max-width: 700px) {
  .sidebar { display: none; }
}
</style>

<script>
var MAP_DATA = {"title": "Zork I - The Great Underground Empire", "startRoom": "west-of-house", "rooms": [{"id": "west-of-house", "name": "West of House", "description": "You are standing in an open field west of a white house, with a boarded front door.", "visits": 2, "x": 7, "y": 7, "cx": 1200, "cy": 900}, {"id": "north-of-house", "name": "North of House", "description": "You are facing the north side of a white house. There is no door here, and all the windows are boarded up. To the north a narrow path winds through the trees.", "visits": 7, "x": 7, "y": 6, "cx": 1200, "cy": 780}, {"id": "forest-path", "name": "Forest Path", "description": "This is a path winding through a dimly lit forest. The path heads north-south here. One particularly large tree with some low branches stands at the edge of the path.", "visits": 6, "x": 7, "y": 5, "cx": 1200, "cy": 660}, {"id": "up-a-tree", "name": "Up a Tree", "description": "You are about 10 feet above the ground nestled among some large branches. The nearest branch above you is above your reach.", "visits": 1, "x": 7, "y": 4, "cx": 1200, "cy": 540}, {"id": "behind-house", "name": "Behind House", "description": "You are behind the white house. A path leads into the forest to the east. In one corner of the house there is a small window which is slightly ajar.", "visits": 8, "x": 8, "y": 6, "cx": 1360, "cy": 780}, {"id": "kitchen", "name": "Kitchen", "description": "You are in the kitchen of the white house. A table seems to have been used recently for the preparation of food. A passage leads to the west and a dark staircase can be seen leading upward. A dark chimney leads down and to the east is a small window which is open.", "visits": 10, "x": 6, "y": 6, "cx": 1040, "cy": 780}, {"id": "living-room", "name": "Living Room", "description": "You are in the living room. There is a doorway to the east, a wooden door with strange gothic lettering to the west, which appears to be nailed shut, a trophy case, and a large oriental rug in the center of the room.", "visits": 12, "x": 5, "y": 6, "cx": 880, "cy": 780}, {"id": "attic", "name": "Attic", "description": "This is the attic, a low-ceilinged room thick with dust and the faint smell of old wood. Exposed rafters run overhead, and pale light filters through cracks in the boarded-up windows. The only exit is a stairway leading down.", "visits": 1, "x": 5, "y": 4, "cx": 880, "cy": 540}, {"id": "east-of-chasm", "name": "East of Chasm", "description": "You are on the east edge of a chasm, the bottom of which cannot be seen. A narrow passage goes north, and the path you are on continues to the east.", "visits": 3, "x": 5, "y": 7, "cx": 880, "cy": 900}, {"id": "gallery", "name": "Gallery", "description": "This is an art gallery. Most of the paintings have been stolen by vandals with exceptional taste. The vandals left through either the north or west exits.", "visits": 1, "x": 6, "y": 7, "cx": 1040, "cy": 900}, {"id": "cellar", "name": "Cellar", "description": "You are in a dark and damp cellar with a narrow passageway leading north, and a crawlway to the south. On the west is the bottom of a steep metal ramp which is unclimbable.", "visits": 8, "x": 5, "y": 8, "cx": 880, "cy": 1020}, {"id": "east-west-passage", "name": "East-West Passage", "description": "This is a narrow east-west passageway. There is a narrow stairway leading down at the north end of the room.", "visits": 9, "x": 7, "y": 8, "cx": 1200, "cy": 1020}, {"id": "round-room", "name": "Round Room", "description": "This is a circular stone room with passages in all directions. Several of them have unfortunately been blocked by cave-ins.", "visits": 10, "x": 8, "y": 8, "cx": 1360, "cy": 1020}, {"id": "loud-room", "name": "Loud Room", "description": "This is a large room with a ceiling which cannot be detected from the ground. There is a narrow passage from east to west and a stone stairway leading upward. The room is deafeningly loud with an undetermined rushing sound. The sound seems to reverberate from all of the walls, making it difficult even to think.", "visits": 1, "x": 9, "y": 8, "cx": 1520, "cy": 1020}, {"id": "north-south-passage", "name": "North-South Passage", "description": "This is a high north-south passage, which forks to the northeast.", "visits": 5, "x": 9, "y": 6, "cx": 1520, "cy": 780}, {"id": "deep-canyon", "name": "Deep Canyon", "description": "You are on the south edge of a deep canyon. Passages lead off to the east, northwest and southwest. A stairway leads down. You can hear the sound of flowing water from below.", "visits": 5, "x": 10, "y": 5, "cx": 1680, "cy": 660}, {"id": "dam", "name": "Dam", "description": "You are standing on the top of Flood Control Dam #3, which was quite a tourist attraction in times far distant. There are paths to the north, south, and west, and a scramble down.", "visits": 3, "x": 11, "y": 5, "cx": 1840, "cy": 660}, {"id": "dam-lobby", "name": "Dam Lobby", "description": "This room appears to have been the waiting room for groups touring the dam. There are open doorways here to the north and east marked \"Private\", and there is a path leading south over the top of the dam.", "visits": 2, "x": 11, "y": 4, "cx": 1840, "cy": 540}, {"id": "maintenance-room", "name": "Maintenance Room", "description": "This is what appears to have been the maintenance room for Flood Control Dam #3. Apparently, this room has been ransacked recently, for most of the valuable equipment is gone. On the wall in front of you is a group of buttons colored blue, yellow, brown, and red. There are doorways to the west and south.", "visits": 1, "x": 11, "y": 3, "cx": 1840, "cy": 420}, {"id": "maze", "name": "Maze", "description": "This is part of a maze of twisty little passages, all alike.", "visits": 28, "x": 4, "y": 8, "cx": 720, "cy": 1020}, {"id": "cyclops-room", "name": "Cyclops Room", "description": "This room has an exit on the northwest, and a staircase leading up.", "visits": 6, "x": 5, "y": 9, "cx": 880, "cy": 1140}, {"id": "strange-passage", "name": "Strange Passage", "description": "This is a long passage. To the west is one entrance. On the east there is an old wooden door, with a large opening in it (about cyclops sized).", "visits": 4, "x": 6, "y": 9, "cx": 1040, "cy": 1140}, {"id": "engravings-cave", "name": "Engravings Cave", "description": "You have entered a low cave with passages leading northwest and east.", "visits": 2, "x": 9, "y": 9, "cx": 1520, "cy": 1140}, {"id": "dome-room", "name": "Dome Room", "description": "You are at the periphery of a large dome, which forms the ceiling of another room below. Protecting you from a precipitous drop is a wooden railing which circles the dome.", "visits": 2, "x": 10, "y": 9, "cx": 1680, "cy": 1140}, {"id": "torch-room", "name": "Torch Room", "description": "This is a large room with a prominent doorway leading to a down staircase. Above you is a large dome. Up around the edge of the dome (20 feet up) is a wooden railing. In the center of the room sits a white marble pedestal. A piece of rope descends from the railing above, ending some five feet above your head.", "visits": 2, "x": 10, "y": 10, "cx": 1680, "cy": 1260}, {"id": "temple", "name": "Temple", "description": "This is the north end of a large temple. On the east wall is an ancient inscription, probably a prayer in a long-forgotten language. Below the prayer is a staircase leading down. The west wall is solid granite. The exit to the north end of the room is through huge marble pillars.", "visits": 3, "x": 10, "y": 11, "cx": 1680, "cy": 1380}, {"id": "altar", "name": "Altar", "description": "This is the south end of a large temple. In front of you is what appears to be an altar. In one corner is a small hole in the floor which leads into darkness. You probably could not get back up it.", "visits": 2, "x": 10, "y": 12, "cx": 1680, "cy": 1500}, {"id": "cave", "name": "Cave", "description": "This is a tiny cave with entrances west and north, and a dark, forbidding staircase leading down.", "visits": 2, "x": 10, "y": 14, "cx": 1680, "cy": 1740}, {"id": "entrance-to-hades", "name": "Entrance to Hades", "description": "You are outside a large gateway, on which is inscribed", "visits": 2, "x": 10, "y": 15, "cx": 1680, "cy": 1860}, {"id": "land-of-the-dead", "name": "Land of the Dead", "description": "You have entered the Land of the Living Dead. Thousands of lost souls can be heard weeping and moaning. In the corner are stacked the remains of dozens of previous adventurers less fortunate than yourself. A passage exits to the north.", "visits": 1, "x": 10, "y": 16, "cx": 1680, "cy": 1980}, {"id": "mirror-room", "name": "Mirror Room", "description": "You are in a large square room with tall ceilings. On the south wall is an enormous mirror which fills the entire wall. There are exits on the other three sides of the room.", "visits": 2, "x": 8, "y": 10, "cx": 1360, "cy": 1260}, {"id": "narrow-passage", "name": "Narrow Passage", "description": "This is a long and narrow corridor where a long north-south passageway briefly narrows even further.", "visits": 2, "x": 8, "y": 9, "cx": 1360, "cy": 1140}, {"id": "egyptian-room", "name": "Egyptian Room", "description": "This is a room which looks like an Egyptian tomb. There is an ascending staircase to the west.", "visits": 1, "x": 10, "y": 13, "cx": 1680, "cy": 1620}, {"id": "forest", "name": "Forest", "description": "This is a forest, with trees in all directions. To the east, there appears to be sunlight. A faint breeze stirs the branches overhead, carrying the earthy scent of decaying leaves and damp moss.", "visits": 5, "x": 6, "y": 5, "cx": 1040, "cy": 660}, {"id": "clearing", "name": "Clearing", "description": "You are in a small clearing in a well marked forest path that extends to the east and west.", "visits": 3, "x": 6, "y": 4, "cx": 1040, "cy": 540}, {"id": "canyon-view", "name": "Canyon View", "description": "You are at the top of the Great Canyon on its west wall. From here there is a marvelous view of the canyon and parts of the Frigid River upstream. Across the canyon, the walls of the White Cliffs join the mighty ramparts of the Flathead Mountains to the east. Following the Canyon upstream to the north, Aragain Falls may be seen, complete with rainbow. The mighty Frigid River flows out from a great dark cavern. To the west and south can be seen an immense forest, stretching for miles around. A path leads northwest. It is possible to climb down into the canyon from here.", "visits": 3, "x": 8, "y": 4, "cx": 1360, "cy": 540}, {"id": "rocky-ledge", "name": "Rocky Ledge", "description": "You are on a ledge about halfway up the wall of the river canyon. You can see from here that the main flow from Aragain Falls twists along a passage which it is impossible for you to enter. Below you is the canyon bottom. Above you is more cliff, which appears climbable.", "visits": 3, "x": 8, "y": 5, "cx": 1360, "cy": 660}, {"id": "canyon-bottom", "name": "Canyon Bottom", "description": "You are beneath the walls of the river canyon which may be climbable here. The lesser part of the runoff of Aragain Falls flows by below. To the north is a narrow path.", "visits": 3, "x": 9, "y": 5, "cx": 1520, "cy": 660}, {"id": "end-of-rainbow", "name": "End of Rainbow", "description": "You are on a small, rocky beach on the continuation of the Frigid River past the Falls. The beach is narrow due to the presence of the White Cliffs. The river canyon opens here and sunlight shines in from above. A rainbow crosses over the falls to the east and a narrow path continues to the southwest.", "visits": 2, "x": 9, "y": 4, "cx": 1520, "cy": 540}, {"id": "reservoir-south", "name": "Reservoir South", "description": "You are in a long room, to the north of which was formerly a lake. However, with the water level lowered, there is merely a wide stream running through the center of the room.", "visits": 2, "x": 8, "y": 3, "cx": 1360, "cy": 420}, {"id": "reservoir", "name": "Reservoir", "description": "You are on what used to be a large lake, but which is now a large mud pile. There are \"shores\" to the north and south.", "visits": 2, "x": 8, "y": 2, "cx": 1360, "cy": 300}, {"id": "reservoir-north", "name": "Reservoir North", "description": "You are in a large cavernous room, the south of which was formerly a lake. However, with the water level lowered, there is merely a wide stream running through there.", "visits": 2, "x": 8, "y": 1, "cx": 1360, "cy": 180}, {"id": "atlantis-room", "name": "Atlantis Room", "description": "This is an ancient room, long under water. There is an exit to the south and a staircase leading up.", "visits": 1, "x": 8, "y": 0, "cx": 1360, "cy": 60}, {"id": "cold-passage", "name": "Cold Passage", "description": "This is a cold and damp corridor where a long east-west passageway turns into a southward path.", "visits": 1, "x": 7, "y": 9, "cx": 1200, "cy": 1140}, {"id": "slide-room", "name": "Slide Room", "description": "This is a small chamber, which appears to have been part of a coal mine. On the south wall of the chamber the letters \"Granite Wall\" are etched in the rock. To the east is a long passage, and there is a steep metal slide twisting downward. To the north is a small opening.", "visits": 2, "x": 5, "y": 10, "cx": 880, "cy": 1260}, {"id": "mine-entrance", "name": "Mine Entrance", "description": "You are standing at the entrance of what might have been a coal mine. The shaft enters the west wall, and there is another exit on the south end of the room.", "visits": 2, "x": 4, "y": 9, "cx": 720, "cy": 1140}, {"id": "squeaky-room", "name": "Squeaky Room", "description": "You are in a small room. Strange squeaky sounds may be heard coming from the passage at the north end. You may also escape to the east.", "visits": 2, "x": 3, "y": 9, "cx": 560, "cy": 1140}, {"id": "bat-room", "name": "Bat Room", "description": "You are in a small room which has doors only to the east and south. In the corner of the room on the ceiling is a large vampire bat who is obviously deranged and holding his nose.", "visits": 2, "x": 3, "y": 8, "cx": 560, "cy": 1020}, {"id": "shaft-room", "name": "Shaft Room", "description": "This is a large room, in the middle of which is a small shaft descending through the floor into darkness below. To the west and the north are exits from this room. Constructed over the top of the shaft is a metal framework to which a heavy iron chain is attached.", "visits": 3, "x": 3, "y": 7, "cx": 560, "cy": 900}, {"id": "smelly-room", "name": "Smelly Room", "description": "This is a small nondescript room. However, from the direction of a small descending staircase a foul odor can be detected. To the south is a narrow tunnel.", "visits": 4, "x": 3, "y": 6, "cx": 560, "cy": 780}, {"id": "gas-room", "name": "Gas Room", "description": "This is a small room which smells strongly of coal gas. There is a short climb up some stairs and a narrow tunnel leading east.", "visits": 4, "x": 2, "y": 6, "cx": 400, "cy": 780}, {"id": "coal-mine", "name": "Coal Mine", "description": "This is a nondescript part of a coal mine.", "visits": 16, "x": 4, "y": 6, "cx": 720, "cy": 780}, {"id": "ladder-top", "name": "Ladder Top", "description": "This is a very small room. In the corner is a rickety wooden ladder, leading downward. It might be safe to descend. There is also a staircase leading upward.", "visits": 4, "x": 4, "y": 7, "cx": 720, "cy": 900}, {"id": "ladder-bottom", "name": "Ladder Bottom", "description": "This is a rather wide room. On one side is the bottom of a narrow wooden ladder. To the west and the south are passages leaving the room.", "visits": 4, "x": 2, "y": 7, "cx": 400, "cy": 900}, {"id": "dead-end", "name": "Dead End", "description": "You have come to a dead end in the mine.", "visits": 1, "x": 2, "y": 8, "cx": 400, "cy": 1020}, {"id": "timber-room", "name": "Timber Room", "description": "This is a long and narrow passage, which is cluttered with broken timbers. A wide passage comes from the east and turns at the west end of the room into a very narrow passageway. From the west comes a strong draft.", "visits": 2, "x": 1, "y": 7, "cx": 240, "cy": 900}, {"id": "drafty-room", "name": "Drafty Room", "description": "This is a small drafty room in which is the bottom of a long shaft. To the south is a passageway and to the east a very narrow passage. In the shaft can be seen a heavy iron chain.", "visits": 2, "x": 0, "y": 7, "cx": 80, "cy": 900}, {"id": "machine-room", "name": "Machine Room", "description": "This is a large, cold room whose sole exit is to the north. In one corner there is a machine which is reminiscent of a clothes dryer. On its face is a switch which is labelled \"START\". The switch does not appear to be manipulable by any human hand (unless the fingers are about 1/16 by 1/4 inch). On the front of the machine is a large lid, which is closed.", "visits": 1, "x": 0, "y": 8, "cx": 80, "cy": 1020}, {"id": "dam-base", "name": "Dam Base", "description": "You are at the base of Flood Control Dam #3, which looms above you and to the north. The river Frigid is flowing by here. Along the river are the White Cliffs which seem to form giant walls stretching from north to south along the shores of the river as it winds its way downstream.", "visits": 1, "x": 11, "y": 6, "cx": 1840, "cy": 780}, {"id": "time-passes", "name": "Time passes...", "description": "The flow of the river carries you downstream.", "visits": 3, "x": 12, "y": 6, "cx": 2000, "cy": 780}, {"id": "sandy-beach-in-the-magic-boat", "name": "Sandy Beach (in the magic boat)", "description": "You are on a large sandy beach on the east shore of the river, which is flowing quickly by. A path runs beside the river to the south here, and a passage is partially buried in sand to the northeast.", "visits": 1, "x": 13, "y": 6, "cx": 2160, "cy": 780}, {"id": "sandy-cave", "name": "Sandy Cave", "description": "This is a small, low-ceilinged cave nearly filled with fine white sand. The /* --- Pan & Zoom --- */
var svg = document.getElementById('map-svg');
var vb = MAP_DATA.viewBox; // [x, y, w, h]
var viewBox = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
var origVB = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
var isPanning = false;
var panStart = { x: 0, y: 0 };
var panVBStart = { x: 0, y: 0 };

function applyViewBox() {
  svg.setAttribute('viewBox', viewBox.x + ' ' + viewBox.y + ' ' + viewBox.w + ' ' + viewBox.h);
}
applyViewBox();

svg.addEventListener('mousedown', function(e) {
  if (e.target.closest('.room-box')) return;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY };
  panVBStart = { x: viewBox.x, y: viewBox.y };
});

window.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  var rect = svg.getBoundingClientRect();
  var scaleX = viewBox.w / rect.width;
  var scaleY = viewBox.h / rect.height;
  viewBox.x = panVBStart.x - (e.clientX - panStart.x) * scaleX;
  viewBox.y = panVBStart.y - (e.clientY - panStart.y) * scaleY;
  applyViewBox();
});

window.addEventListener('mouseup', function() { isPanning = false; });

svg.addEventListener('wheel', function(e) {
  e.preventDefault();
  var rect = svg.getBoundingClientRect();
  var mx = (e.clientX - rect.left) / rect.width;
  var my = (e.clientY - rect.top) / rect.height;
  var factor = e.deltaY > 0 ? 1.15 : 0.87;
  var newW = viewBox.w * factor;
  var newH = viewBox.h * factor;
  viewBox.x += (viewBox.w - newW) * mx;
  viewBox.y += (viewBox.h - newH) * my;
  viewBox.w = newW;
  viewBox.h = newH;
  applyViewBox();
}, { passive: false });

function zoomBy(factor) {
  var cx = viewBox.x + viewBox.w / 2;
  var cy = viewBox.y + viewBox.h / 2;
  viewBox.w *= factor;
  viewBox.h *= factor;
  viewBox.x = cx - viewBox.w / 2;
  viewBox.y = cy - viewBox.h / 2;
  applyViewBox();
}

function resetView() {
  viewBox = { x: origVB.x, y: origVB.y, w: origVB.w, h: origVB.h };
  applyViewBox();
}

document.getElementById('btn-zoom-in').addEventListener('click', function() { zoomBy(0.75); });
document.getElementById('btn-zoom-out').addEventListener('click', function() { zoomBy(1.33); });
document.getElementById('btn-reset').addEventListener('click', resetView);

/* --- Room list --- */
var roomList = document.getElementById('room-list');
var rooms = MAP_DATA.rooms;
var edges = MAP_DATA.edges;

rooms.sort(function(a, b) {
  if (a.id === MAP_DATA.startRoom) return -1;
  if (b.id === MAP_DATA.startRoom) return 1;
  return a.name.localeCompare(b.name);
});

var html = '';
for (var i = 0; i < rooms.length; i++) {
  var r = rooms[i];
  var cls = 'room-item' + (r.id === MAP_DATA.startRoom ? ' start-room' : '');
  html += '<div class="' + cls + '" data-room="' + r.id + '">';
  html += esc(r.name);
  if (r.visits > 1) html += '<span class="visit-count">(' + r.visits + 'x)</span>';
  html += '</div>';
}
roomList.innerHTML = html;

/* --- Click room in sidebar --- */
roomList.addEventListener('click', function(e) {
  var item = e.target.closest('.room-item');
  if (!item) return;
  var roomId = item.dataset.room;
  highlightRoom(roomId);
  centerOnRoom(roomId);
});

/* --- Click room in SVG --- */
svg.addEventListener('click', function(e) {
  var box = e.target.closest('.room-box');
  if (!box) return;
  var roomId = box.dataset.room;
  highlightRoom(roomId);
  // Scroll sidebar
  var sideItem = roomList.querySelector('[data-room="' + roomId + '"]');
  if (sideItem) sideItem.scrollIntoView({ block: 'nearest' });
});

/* --- Tooltip --- */
var tooltip = document.getElementById('tooltip');

svg.addEventListener('mouseover', function(e) {
  var box = e.target.closest('.room-box');
  if (!box) { tooltip.style.display = 'none'; return; }
  var roomId = box.dataset.room;
  var room = MAP_DATA.rooms.find(function(r) { return r.id === roomId; });
  if (!room) return;
  tooltip.querySelector('.tt-name').textContent = room.name;
  var desc = room.description || '';
  if (desc.length > 120) desc = desc.slice(0, 120) + '...';
  tooltip.querySelector('.tt-desc').textContent = desc;
  tooltip.style.display = 'block';
});

svg.addEventListener('mousemove', function(e) {
  if (tooltip.style.display === 'block') {
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
  }
});

svg.addEventListener('mouseout', function(e) {
  if (!e.target.closest('.room-box')) tooltip.style.display = 'none';
});

/* --- Highlight --- */
var activeRoom = null;

function highlightRoom(roomId) {
  // Clear previous
  svg.querySelectorAll('.room-box.highlighted').forEach(function(el) { el.classList.remove('highlighted'); });
  svg.querySelectorAll('.edge-line.highlighted').forEach(function(el) { el.classList.remove('highlighted'); });
  roomList.querySelectorAll('.room-item.active').forEach(function(el) { el.classList.remove('active'); });

  if (activeRoom === roomId) { activeRoom = null; return; }
  activeRoom = roomId;

  // Highlight room box
  var box = svg.querySelector('.room-box[data-room="' + roomId + '"]');
  if (box) box.classList.add('highlighted');

  // Highlight sidebar
  var sideItem = roomList.querySelector('[data-room="' + roomId + '"]');
  if (sideItem) sideItem.classList.add('active');

  // Highlight connected edges
  svg.querySelectorAll('.edge-line').forEach(function(el) {
    if (el.dataset.from === roomId || el.dataset.to === roomId) {
      el.classList.add('highlighted');
    }
  });
}

function centerOnRoom(roomId) {
  var room = MAP_DATA.rooms.find(function(r) { return r.id === roomId; });
  if (!room) return;
  viewBox.x = room.cx - viewBox.w / 2;
  viewBox.y = room.cy - viewBox.h / 2;
  applyViewBox();
}

/* --- Keyboard --- */
document.addEventListener('keydown', function(e) {
  var panAmt = viewBox.w * 0.1;
  if (e.key === 'ArrowLeft') { viewBox.x -= panAmt; applyViewBox(); }
  else if (e.key === 'ArrowRight') { viewBox.x += panAmt; applyViewBox(); }
  else if (e.key === 'ArrowUp') { viewBox.y -= panAmt; applyViewBox(); }
  else if (e.key === 'ArrowDown') { viewBox.y += panAmt; applyViewBox(); }
  else if (e.key === '+' || e.key === '=') { zoomBy(0.8); }
  else if (e.key === '-') { zoomBy(1.25); }
  else if (e.key === 'r' || e.key === 'R') { resetView(); }
});

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
