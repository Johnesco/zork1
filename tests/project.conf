#!/bin/bash
# Zork I: Inform 7 Edition — project-specific test configuration
# Sourced by the generic testing framework (tools/testing/*.sh)
#
# PROJECT_DIR is set by the framework before sourcing this file.

# Project identity
PROJECT_NAME="Zork I"

# Primary engine (Inform 7 / Glulx)
PRIMARY_ENGINE_NAME="glulxe"
PRIMARY_ENGINE_PATH="$HOME/glulxe/glulxe"
PRIMARY_ENGINE_SEED_FLAG="--rngseed"
PRIMARY_GAME_PATH="$PROJECT_DIR/zork1.ulx"
PRIMARY_WALKTHROUGH="$PROJECT_DIR/tests/inform7/walkthrough.txt"
PRIMARY_OUTPUT_FILE="$PROJECT_DIR/tests/inform7/walkthrough_output.txt"
PRIMARY_SEEDS_KEY="glulxe"

# Alternate engine (ZIL / Z-machine)
ALT_ENGINE_NAME="dfrotz"
ALT_ENGINE_PATH="$HOME/frotz-install/usr/games/dfrotz"
ALT_ENGINE_SEED_FLAG="-s"
ALT_GAME_PATH="/mnt/c/code/zork1-zil/zork1.z3"
ALT_WALKTHROUGH="$PROJECT_DIR/tests/zil/walkthrough.txt"
ALT_OUTPUT_FILE="$PROJECT_DIR/tests/zil/walkthrough_output.txt"
ALT_SEEDS_KEY="dfrotz"

# Score extraction patterns
SCORE_REGEX='score is \K[0-9]+'
SCORE_FALLBACK_REGEX='[0-9]+(?= \(total of [0-9]+ points\))'
MAX_SCORE_REGEX='total of \K[0-9]+'
PASS_THRESHOLD=350
DEFAULT_MAX_SCORE=350

# Diagnostic patterns
DEATH_PATTERNS='you have died|eaten by a grue|your body to the'
WON_PATTERNS='ancient map|barrow|endgame'

# RegTest config
REGTEST_FILE="$PROJECT_DIR/tests/zork1.regtest"
REGTEST_ENGINE="$HOME/glulxe/glulxe"
REGTEST_GAME="$PROJECT_DIR/zork1.ulx"

# Project-specific diagnostics (called by run-walkthrough.sh)
# $1 = path to transcript output file
diagnostics_extra() {
    local TMPFILE="$1"

    # Helper (same as in framework, redefined for safety)
    _count_i() {
        local count
        count=$(grep -ciP "$1" "$2" 2>/dev/null) || count=0
        echo "$count"
    }

    # Troll status
    local TROLL_KILLED=false
    if grep -qiP 'breathes? his last|almost all dead|collapses' "$TMPFILE" 2>/dev/null; then
        TROLL_KILLED=true
    fi
    local TROLL_BLOCKS
    TROLL_BLOCKS=$(_count_i 'troll.*blocks|blocks all passages|troll fends' "$TMPFILE")

    # Thief encounters
    local THIEF_ENCOUNTERS
    THIEF_ENCOUNTERS=$(_count_i 'thief|nasty-looking|stiletto' "$TMPFILE")
    local THIEF_STEALS
    THIEF_STEALS=$(_count_i 'relieved of|stripped|removes.*from|steals|takes.*from you' "$TMPFILE")

    if [[ "$TROLL_KILLED" == true ]]; then
        echo "Troll:   KILLED"
    elif [[ "$TROLL_BLOCKS" -gt 0 ]]; then
        echo "Troll:   SURVIVED ($TROLL_BLOCKS blocking messages)"
    else
        echo "Troll:   (not encountered or already dead)"
    fi

    echo "Thief:   $THIEF_ENCOUNTERS mentions, $THIEF_STEALS thefts detected"
}
