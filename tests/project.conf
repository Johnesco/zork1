#!/bin/bash
# Zork I: Inform 7 Edition — project-specific test configuration
# Parsed by the workspace test runners (C:/code/text-games/i7/tools/*.py)
#
# PROJECT_DIR is set by the framework before sourcing this file.

# Project identity
PROJECT_NAME="Zork I"

# Resolve ifhub root (PROJECT_DIR is projects/zork1, ifhub is two levels up)
_IFHUB_ROOT="$(cd "$PROJECT_DIR/../.." && pwd)"

# Platform detection: prefer native Windows interpreters if available
_NATIVE_GLULXE="$_IFHUB_ROOT/tools/interpreters/glulxe.exe"
_NATIVE_DFROTZ="$_IFHUB_ROOT/tools/interpreters/dfrotz.exe"

if [[ ("$OSTYPE" == "msys" || "$OSTYPE" == "cygwin") && -x "$_NATIVE_GLULXE" ]]; then
    # Native Windows — no WSL needed
    PRIMARY_ENGINE_NAME="glulxe"
    PRIMARY_ENGINE_PATH="$_NATIVE_GLULXE"
    PRIMARY_ENGINE_SEED_FLAG="--rngseed"
    PRIMARY_GAME_PATH="$PROJECT_DIR/zork1.ulx"
    PRIMARY_WALKTHROUGH="$PROJECT_DIR/tests/inform7/walkthrough.txt"
    PRIMARY_OUTPUT_FILE="$PROJECT_DIR/tests/inform7/walkthrough_output.txt"
    PRIMARY_SEEDS_KEY="glulxe"

    # Alternate engine (ZIL / Z-machine)
    ALT_ENGINE_NAME="dfrotz"
    if [[ -x "$_NATIVE_DFROTZ" ]]; then
        ALT_ENGINE_PATH="$_NATIVE_DFROTZ"
    else
        ALT_ENGINE_PATH="$_NATIVE_DFROTZ"  # will fail at runtime if missing
    fi
    ALT_ENGINE_SEED_FLAG="-s"
    ALT_GAME_PATH="$PROJECT_DIR/zork1-v0.z3"
    ALT_WALKTHROUGH="$PROJECT_DIR/tests/zil/walkthrough.txt"
    ALT_OUTPUT_FILE="$PROJECT_DIR/tests/zil/walkthrough_output.txt"
    ALT_SEEDS_KEY="dfrotz"

    # RegTest config
    REGTEST_FILE="$PROJECT_DIR/tests/zork1.scenario"
    REGTEST_ENGINE="$_NATIVE_GLULXE"
    REGTEST_GAME="$PROJECT_DIR/zork1.ulx"
else
    # WSL/Linux paths (original defaults)
    PRIMARY_ENGINE_NAME="glulxe"
    PRIMARY_ENGINE_PATH="$HOME/glulxe/glulxe"
    PRIMARY_ENGINE_SEED_FLAG="--rngseed"
    PRIMARY_GAME_PATH="$PROJECT_DIR/zork1.ulx"
    PRIMARY_WALKTHROUGH="$PROJECT_DIR/tests/inform7/walkthrough.txt"
    PRIMARY_OUTPUT_FILE="$PROJECT_DIR/tests/inform7/walkthrough_output.txt"
    PRIMARY_SEEDS_KEY="glulxe"

    # Alternate engine (ZIL / Z-machine)
    ALT_ENGINE_NAME="dfrotz"
    ALT_ENGINE_PATH="$HOME/frotz-install/usr/games/dfrotz"
    ALT_ENGINE_SEED_FLAG="-s"
    ALT_GAME_PATH="$PROJECT_DIR/zork1-v0.z3"
    ALT_WALKTHROUGH="$PROJECT_DIR/tests/zil/walkthrough.txt"
    ALT_OUTPUT_FILE="$PROJECT_DIR/tests/zil/walkthrough_output.txt"
    ALT_SEEDS_KEY="dfrotz"

    # RegTest config
    REGTEST_FILE="$PROJECT_DIR/tests/zork1.scenario"
    REGTEST_ENGINE="$HOME/glulxe/glulxe"
    REGTEST_GAME="$PROJECT_DIR/zork1.ulx"
fi

# Score extraction patterns
SCORE_REGEX='score is \K[0-9]+'
SCORE_FALLBACK_REGEX='[0-9]+(?= \(total of [0-9]+ points\))'
MAX_SCORE_REGEX='total of \K[0-9]+'
PASS_THRESHOLD=350
DEFAULT_MAX_SCORE=350

# Diagnostic patterns
DEATH_PATTERNS='you have died|eaten by a grue|your body to the'
WON_PATTERNS='ancient map|barrow|endgame'

# Parser-error wording. The unprefixed keys are Inform 7's; the ALT_ ones are the
# Infocom/ZIL parser's, used for --alt runs against the v0 Z-machine build. They
# are not interchangeable: Inform says "You can't see any such thing", ZIL says
# "You can't see any troll here!", so matching on Inform's phrasing alone reports
# zero errors for every ZIL run no matter what the transcript contains.
ERROR_UNKNOWN_OBJECT="can't see any such thing"
ERROR_BAD_EXIT="can't go that way"
ERROR_OTHER='that.s not something you can|I only understood'
ALT_ERROR_UNKNOWN_OBJECT="can't see any .*here|You don't have that|isn't here"
ALT_ERROR_BAD_EXIT="You can't go that way|There is a wall there"
ALT_ERROR_OTHER="I don't know the word|That sentence isn't one I understand|I can't use the word"

# Pipeline config (used by tools/pipeline.py, ignored by testing framework)
PIPELINE_SOUND=true
PIPELINE_VERSIONED=true
PIPELINE_CURRENT_VERSION=""
PIPELINE_HUB_ID="zork1"
PIPELINE_TESTS="walkthrough,regtest"
PIPELINE_WALKTHROUGH_OUTPUT_DIR="$PROJECT_DIR"

# Project-specific diagnostics (called by run_walkthrough.py)
# $1 = path to transcript output file
diagnostics_extra() {
    local TMPFILE="$1"

    # Helper (same as in framework, redefined for safety)
    _count_i() {
        local count
        count=$(grep -ciE "$1" "$2" 2>/dev/null) || count=0
        echo "$count"
    }

    # Troll status
    local TROLL_KILLED=false
    if grep -qiE 'breathes? his last|almost all dead|collapses' "$TMPFILE" 2>/dev/null; then
        TROLL_KILLED=true
    fi
    local TROLL_BLOCKS
    TROLL_BLOCKS=$(_count_i 'troll.*blocks|blocks all passages|troll fends' "$TMPFILE")

    # Thief encounters
    local THIEF_ENCOUNTERS
    THIEF_ENCOUNTERS=$(_count_i 'thief|nasty-looking|stiletto' "$TMPFILE")
    # "robbed you blind" is the ZIL wording for an offscreen theft and was missing,
    # so a run that lost its whole inventory still reported "0 thefts detected".
    local THIEF_STEALS
    THIEF_STEALS=$(_count_i 'relieved of|stripped|removes.*from|steals|takes.*from you|robbed you blind' "$TMPFILE")

    if [[ "$TROLL_KILLED" == true ]]; then
        echo "Troll:   KILLED"
    elif [[ "$TROLL_BLOCKS" -gt 0 ]]; then
        echo "Troll:   SURVIVED ($TROLL_BLOCKS blocking messages)"
    else
        echo "Troll:   (not encountered or already dead)"
    fi

    echo "Thief:   $THIEF_ENCOUNTERS mentions, $THIEF_STEALS thefts detected"
}
